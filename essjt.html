<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<title>Contact Us – ESSJT</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  color:#f8fafc;
  background: linear-gradient(-45deg,#1e3a8a,#8b5cf6,#ec4899,#2563eb);
  background-size: 400% 400%;
  animation: gradientBG 20s ease infinite;
}
@keyframes gradientBG{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}
header{
  text-align:center;
  padding:50px 20px;
}
header h1{ font-size:3rem; font-weight:700; color:#f0f9ff; }
header p{ margin-top:10px; font-size:1.1rem; opacity:0.9; }

/* ===== MAIN ===== */
main{ max-width:900px; margin:auto; padding:50px 20px; }

/* ===== SECTION TITLE ===== */
.section-title{
  text-align:center;
  font-size:2.4rem;
  margin-bottom:40px;
  color:#f0f9ff;
  position:relative;
}
.section-title::after{
  content:"";
  width:90px;
  height:4px;
  background: linear-gradient(90deg,#22d3ee,#a78bfa);
  display:block;
  margin:12px auto 0;
  border-radius:10px;
}

/* ===== CONTACT FORM ===== */
.contact-form{
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(20px);
  border-radius:25px;
  padding:35px;
  margin-bottom:50px;
  box-shadow:0 20px 40px rgba(0,0,0,0.5);
  transition: transform 0.3s, box-shadow 0.3s;
}
.contact-form:hover{
  transform: scale(1.02);
  box-shadow:0 25px 50px rgba(0,0,0,0.6);
}
.contact-form form{ display:flex; flex-direction:column; gap:18px; }
.contact-form input, .contact-form textarea{
  padding:14px 16px;
  border-radius:15px;
  border:none;
  outline:none;
  font-size:1rem;
  background: rgba(255,255,255,0.08);
  color:#f8fafc;
  transition: background 0.3s, transform 0.2s;
}
.contact-form input:focus, .contact-form textarea:focus{
  background: rgba(255,255,255,0.2);
  transform: scale(1.02);
}
.contact-form button{
  padding:14px;
  border:none;
  border-radius:25px;
  font-weight:bold;
  background: linear-gradient(90deg,#facc15,#f43f5e);
  color:white;
  cursor:pointer;
  transition: transform 0.3s, box-shadow 0.3s, filter 0.3s;
}
.contact-form button:hover{
  transform: scale(1.05);
  box-shadow:0 8px 25px rgba(255,255,255,0.4);
  filter: brightness(1.1);
}

/* ===== CONTACT INFO ===== */
.contact-info{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:30px;
  margin-top:40px;
}
.info-card{
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(15px);
  border-radius:20px;
  padding:25px 20px;
  text-align:center;
  box-shadow:0 15px 35px rgba(0,0,0,0.4);
  transition: transform 0.3s, box-shadow 0.3s;
}
.info-card:hover{
  transform: translateY(-5px) scale(1.02);
  box-shadow:0 25px 50px rgba(0,0,0,0.6);
}
.info-card i{
  font-size:2rem;
  color:#22d3ee;
  margin-bottom:12px;
  display:block;
  transition: transform 0.3s;
}
.info-card:hover i{ transform: rotate(15deg) scale(1.2); color:#a78bfa; }
.info-card h3{ font-size:1.3rem; margin-bottom:8px; color:#f0f9ff; }
.info-card p{ opacity:0.85; font-size:0.95rem; }

footer{
  text-align:center;
  padding:30px;
  font-size:0.9rem;
  opacity:0.85;
  background:rgba(0,0,0,0.3);
  backdrop-filter:blur(10px);
  border-top:1px solid rgba(255,255,255,0.15);
  margin-top:50px;
}
@media(max-width:600px){
  header h1{ font-size:2rem; }
  .section-title{ font-size:1.8rem; }
}
</style>
</head>
<body>

<header>
<h1>Contact Us – ESSJT</h1>
<p>Twandikire cyangwa utubaze ikibazo cyose kijyanye n'ikigo</p>
</header>

<main>
<h2 class="section-title">Ohereza Ubutumwa</h2>
<div class="contact-form">
  <form>
    <input type="text" placeholder="Izina ryawe" required>
    <input type="email" placeholder="Email yawe" required>
    <input type="text" placeholder="Subject" required>
    <textarea placeholder="Ubutumwa bwawe" rows="5" required></textarea>
    <button type="submit">Ohereza Ubutumwa</button>
  </form>
</div>

<h2 class="section-title">Aho Utubona</h2>
<div class="contact-info">
  <div class="info-card">
    <i class="fas fa-phone-alt"></i>
    <h3>Telephone</h3>
    <p>+250 788 123 456</p>
  </div>
  <div class="info-card">
    <i class="fas fa-envelope"></i>
    <h3>Email</h3>
    <p>info@essjt.rw</p>
  </div>
  <div class="info-card">
    <i class="fas fa-map-marker-alt"></i>
    <h3>Aho turi</h3>
    <p>Kigali, Rwanda</p>
  </div>
  <div class="info-card">
    <i class="fab fa-facebook"></i>
    <h3>Facebook</h3>
    <p>/ESSJTOfficial</p>
  </div>
</div>
</main>

<footer>
© 2026 ESSJT | All rights reserved
</footer>

</body>
</html>
