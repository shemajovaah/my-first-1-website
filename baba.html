<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<title>Umuyobozi w’Ikigo – ESSJT</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  color:#f8fafc;
  background: linear-gradient(-45deg,#1e3a8a,#8b5cf6,#ec4899,#2563eb);
  background-size: 400% 400%;
  animation: gradientBG 20s ease infinite;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:40px 20px;
}
@keyframes gradientBG{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* ===== LEADER CARD ===== */
.leader-card{
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(18px);
  border-radius:25px;
  padding:50px 35px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,0.5);
  transition: transform 0.3s, box-shadow 0.3s;
  max-width:400px;
  width:100%;
}
.leader-card:hover{
  transform: scale(1.03);
  box-shadow:0 30px 60px rgba(0,0,0,0.7);
}
.leader-card img{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:50%;
  margin-bottom:20px;
  border:4px solid #38bdf8;
  transition: transform 0.3s;
}
.leader-card:hover img{ transform: scale(1.1); }

.leader-card h1{ font-size:2rem; margin-bottom:10px; color:#f0f9ff; }
.leader-card p{ font-size:1rem; opacity:0.85; margin-bottom:20px; }

/* ===== ICONS ===== */
.leader-icons i{
  font-size:1.5rem;
  color:#22d3ee;
  margin:0 12px;
  cursor:pointer;
  transition: transform 0.3s, color 0.3s;
}
.leader-icons i:hover{
  transform: scale(1.3) rotate(20deg);
  color:#a78bfa;
}

footer{
  text-align:center;
  padding:20px;
  font-size:0.9rem;
  opacity:0.85;
  background:rgba(0,0,0,0.3);
  backdrop-filter:blur(10px);
  border-top:1px solid rgba(255,255,255,0.15);
  margin-top:40px;
}

@media(max-width:500px){
  .leader-card{ padding:35px 25px; }
  .leader-card h1{ font-size:1.5rem; }
  .leader-card p{ font-size:0.9rem; }
}
</style>
</head>
<body>

<div class="leader-card">
  <img src="https://images.unsplash.com/photo-1603415526960-fd8f6ee5a0b7?auto=format&fit=crop&w=800&q=80" alt="Umuyobozi w'Ikigo">
  <h1>John Doe</h1>
  <p>Umuyobozi Mukuru w’Ikigo – ESSJT</p>
  <div class="leader-icons">
    <i class="fas fa-phone-alt" title="Telephone"></i>
    <i class="fas fa-envelope" title="Email"></i>
    <i class="fab fa-linkedin" title="LinkedIn"></i>
    <i class="fab fa-facebook" title="Facebook"></i>
  </div>
</div>

<footer>
© 2026 ESSJT | All rights reserved
</footer>

</body>
</html>
